<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="size" content="1080x1920">
<title>Сторис 9:16</title>
<link rel="stylesheet" href="/brand/brand.css">
<style>
  /* Безопасная зона сторис: сверху ~250px и снизу ~340px перекрывает интерфейс соцсети. */
  .canvas {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 48px;
    padding: 250px var(--pad) 340px;
    background: linear-gradient(160deg, var(--c-accent) 0%, #c2185b 55%, var(--c-bg) 100%);
  }
  .kicker { font: 400 72px/1 var(--font-hand); color: var(--c-accent-2); }
  h1 { font: 900 150px/0.92 var(--font-display); letter-spacing: -0.03em; text-transform: uppercase; }
  .lead { font: 500 44px/1.3 var(--font-text); max-width: 820px; }
  .cta {
    align-self: flex-start;
    margin-top: 24px;
    font: 800 40px/1 var(--font-text);
    color: var(--c-dark);
    background: var(--c-light);
    padding: 30px 48px;
    border-radius: 999px;
  }
</style>
</head>
<body>
  <main class="canvas">
    <span class="kicker">только сегодня</span>
    <h1>Скидка<br>−30%</h1>
    <p class="lead">Короткое пояснение к предложению. Одна мысль — один экран.</p>
    <span class="cta">Ссылка в профиле →</span>
  </main>
</body>
</html>
