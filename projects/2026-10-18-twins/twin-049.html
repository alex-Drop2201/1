<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="size" content="1080x1920">
<title>Близнец референса 049 — Святая Вечеря</title>
<link rel="stylesheet" href="/brand/brand.css">
<link rel="stylesheet" href="twin.css">
<style>
  /* Референс 049 (вертикальный постер, у нас — сторис): светлый фон, к низу серее; сверху строка
     «день — время — AM» разнесена по ширине; крупная каллиграфия и под ней огромный тяжёлый гротеск
     с градиентом от серого к чёрному; ниже предметное фото (бокал вина и хлеб, длинные тени);
     внизу адрес в две строки по центру. По вертикали подогнано под безопасную зону сторис. */
  :root { --ink: #111; }
  body { background: #e9e9e7; }
  .canvas { background: linear-gradient(180deg, #F3F3F1 0%, #F1F1EF 60%, #D3D2D0 100%); color: var(--ink); }
  .row { left: 151px; right: 162px; top: 268px; display: flex; justify-content: space-between; font: 800 27px/1 'Montserrat'; text-transform: uppercase; letter-spacing: -0.01em; }
  .script { left: 120px; top: 380px; font: 400 230px/1 'Great Vibes'; color: #2a2a2a; white-space: nowrap; }
  .heavy { left: 97px; top: 590px; font: 900 200px/0.9 'Montserrat'; letter-spacing: -0.04em; text-transform: uppercase; white-space: nowrap;
           background: linear-gradient(180deg, #6d6d6d 0%, #1a1a1a 55%, #000 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .still { position: absolute; left: 108px; top: 845px; width: 864px; height: 620px; }
  .still img { position: absolute; }
  .still .glass { left: 344px; top: 0; width: 220px; }
  .still .bread { left: 414px; top: 318px; width: 380px; }
  /* Тень: тот же силуэт, чёрный, сплющенный и скошенный от основания вниз-влево. */
  .still .sh { filter: brightness(0) blur(5px); transform-origin: 50% 100%; }
  .still .sh.glass { transform: scaleY(-.34) skewX(45deg); opacity: .16; }
  .still .sh.bread { transform: translateY(-26px) scaleY(-.36) skewX(45deg); opacity: .26; }
  /* Красный блик вина на тени бокала. */
  .still .caustic { position: absolute; left: 312px; top: 466px; width: 140px; height: 42px; border-radius: 50%;
                    background: radial-gradient(closest-side, rgba(225, 25, 25, .55), rgba(225, 25, 25, 0)); filter: blur(4px); mix-blend-mode: multiply; }
  .addr { left: 0; right: 0; top: 1500px; text-align: center; font: 400 27px/1.4 'Inter'; }
</style>
</head>
<body>
<main class="canvas grain">
  <div class="abs row"><span>Воскресенье</span><span>10:00</span><span>1 ноября</span></div>
  <!-- Предметка собрана из двух стоковых вырезок (бокал и хлеб) с длинными тенями вниз-влево, как в референсе. -->
  <div class="still">
    <img class="sh glass" src="assets/049-glass.png" alt="">
    <img class="sh bread" src="assets/049-bread.png" alt="">
    <div class="caustic"></div>
    <img class="glass" src="assets/049-glass.png" alt="">
    <img class="bread" src="assets/049-bread.png" alt="">
  </div>
  <div class="abs script" id="script">Святая</div>
  <div class="abs heavy" id="heavy">Вечеря</div>
  <div class="abs addr">Адрес церкви — улица, дом<br>Название церкви</div>
</main>
<script src="twin.js"></script>
<script>
  initSlots();
  afterFonts(["900 100px 'Montserrat'", "400 100px 'Great Vibes'"], () => {
    fitWidth(document.getElementById('heavy'), 886);
    fitWidth(document.getElementById('script'), 640);
  });
</script>
</body>
</html>
