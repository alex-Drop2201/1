<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="size" content="1080x1350">
<title>10 — Октябрь</title>
<link rel="stylesheet" href="/brand/brand.css">
<link rel="stylesheet" href="/fonts/canvas-fonts.css">
<style>
  :root { --night: #211913; --cream: #f2e6d3; --tan: #b9a58c; --dim: #84725f; }
  body, .canvas { background: var(--night); color: var(--cream); }
  svg { position: absolute; inset: 0; }
  h1 {
    position: absolute; left: 72px; top: 56px;
    font: 700 168px/1 'Caveat'; letter-spacing: -0.01em;
  }
  .quote {
    position: absolute; left: 80px; top: 252px;
    font: italic 400 25px/1.45 'Lora'; color: var(--tan);
  }
  .quote small { display: block; margin-top: 10px; font: 400 16px/1 'IBM Plex Mono'; letter-spacing: .16em; text-transform: uppercase; color: var(--dim); }
  .year {
    position: absolute; right: 80px; top: 92px;
    font: 400 18px/1 'IBM Plex Mono'; letter-spacing: .2em; color: var(--dim);
  }
  .data {
    position: absolute; left: 80px; right: 80px; bottom: 72px;
    display: flex; justify-content: space-between;
    font: 400 20px/1 'IBM Plex Mono'; color: var(--dim);
  }
  .data b { font-weight: 400; color: var(--cream); }
</style>
</head>
<body>
<main class="canvas">
  <svg id="art" width="1080" height="1350" viewBox="0 0 1080 1350"></svg>
  <h1>Октябрь</h1>
  <div class="year">2026</div>
  <div class="quote">
    Октябрь уж наступил — уж роща отряхает<br>последние листы с нагих своих ветвей…
    <small>А. С. Пушкин, 1833</small>
  </div>
  <div class="data">
    <span>листопад</span>
    <span>день <b>16</b> из 31</span>
  </div>
</main>
<script src="gen.js"></script>
<script>
  const svg = document.getElementById('art');
  const random = rng(1833);
  const today = 16;
  const firstWeekday = 3; // 1 октября 2026 — четверг (пн = 0)
  const x0 = 80;
  const x1 = 1000;
  const colW = (x1 - x0) / 7;
  const headY = 476;
  const y0 = 500;
  const rowH = 146;
  const D = 104;

  const stops = [
    [0, '#6f8a3c'], [0.18, '#a9a43a'], [0.36, '#e3b23c'], [0.52, '#e7852f'],
    [0.68, '#cf4a2a'], [0.84, '#8a3a26'], [1, '#55453b'],
  ];

  ['пн', 'вт', 'ср', 'чт', 'пт', 'сб', 'вс'].forEach((d, i) => {
    svgEl(svg, 'text', {
      x: x0 + colW * (i + 0.5), y: headY, 'text-anchor': 'middle', fill: i > 4 ? '#b9a58c' : '#84725f',
      style: "font: 400 17px 'IBM Plex Mono'; letter-spacing: .14em",
    }, d);
  });
  svgEl(svg, 'line', { x1: x0, y1: headY + 18, x2: x1, y2: headY + 18, stroke: '#84725f', 'stroke-width': 0.8, 'stroke-opacity': 0.5 });

  for (let day = 1; day <= 31; day++) {
    const idx = firstWeekday + day - 1;
    const col = idx % 7;
    const row = Math.floor(idx / 7);
    const cx = x0 + colW * (col + 0.5);
    const cy = y0 + rowH * row + rowH / 2;
    const t = Math.min(1, Math.max(0, (day - 1) / 30 + (random() - 0.5) * 0.05));
    const color = colorAt(stops, t);
    const past = day <= today;
    svgEl(svg, 'circle', past
      ? { cx, cy, r: D / 2, fill: color }
      : { cx, cy, r: D / 2 - 1.5, fill: 'none', stroke: color, 'stroke-width': 3 });
    if (day === today) {
      svgEl(svg, 'circle', { cx, cy, r: D / 2 + 10, fill: 'none', stroke: '#f2e6d3', 'stroke-width': 1.4 });
    }
    // Тёмная цифра на светлом, светлая на тёмном.
    const lum = past && t > 0.1 && t < 0.62;
    svgEl(svg, 'text', {
      x: cx, y: cy + 8, 'text-anchor': 'middle',
      fill: past ? (lum ? '#211913' : '#f2e6d3') : color,
      style: "font: 500 22px 'IBM Plex Mono'",
    }, String(day));
  }
</script>
</body>
</html>
