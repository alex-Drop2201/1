<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="size" content="1080x1350">
<title>05 — Бетон</title>
<link rel="stylesheet" href="/brand/brand.css">
<link rel="stylesheet" href="/fonts/canvas-fonts.css">
<style>
  :root { --base: #1c1b19; --pale: #ebe6dc; --dim: #8f8a80; --fire: #f28a2e; }
  body, .canvas { background: var(--base); color: var(--pale); }
  svg { position: absolute; inset: 0; }
  h1 {
    position: absolute; left: 66px; top: 1000px;
    font: 700 236px/0.86 'Oswald'; letter-spacing: 0.01em; text-transform: uppercase;
  }
  .spec {
    position: absolute; right: 80px; top: 1046px; text-align: right;
    font: 400 20px/1.9 'JetBrains Mono'; color: var(--dim);
  }
  .spec b { font-weight: 400; color: var(--pale); }
  .spec .fire { color: var(--fire); }
</style>
</head>
<body>
<main class="canvas">
  <svg id="art" width="1080" height="1350" viewBox="0 0 1080 1350"></svg>
  <h1>Бетон</h1>
  <div class="spec">
    <div>серия <b>П-44Т</b></div>
    <div><b>17</b> этажей</div>
    <div>с <b>1979</b> года</div>
    <div>окон горит <b class="fire" id="lit">0</b></div>
  </div>
</main>
<script src="gen.js"></script>
<script>
  const svg = document.getElementById('art');
  const random = rng(1979);
  const floors = 17;
  const cols = 9;
  const facadeTop = 0;
  const facadeH = 940;
  const rowH = facadeH / floors;
  const colW = 1080 / cols;

  // Фасад: панели с едва различимым тоном.
  for (let r = 0; r < floors; r++) {
    for (let c = 0; c < cols; c++) {
      const tone = 178 + Math.round((random() - 0.5) * 10);
      svgEl(svg, 'rect', {
        x: c * colW, y: facadeTop + r * rowH, width: colW + 0.5, height: rowH + 0.5,
        fill: `rgb(${tone + 6},${tone + 2},${tone - 5})`,
      });
    }
  }
  // Швы панелей: горизонтальные — по этажам, вертикальные — через секцию.
  for (let r = 1; r < floors; r++) {
    svgEl(svg, 'line', { x1: 0, y1: facadeTop + r * rowH, x2: 1080, y2: facadeTop + r * rowH, stroke: '#8c877d', 'stroke-width': 1.2 });
  }
  for (let c = 1; c < cols; c++) {
    svgEl(svg, 'line', {
      x1: c * colW, y1: facadeTop, x2: c * colW, y2: facadeTop + facadeH,
      stroke: '#8c877d', 'stroke-width': c % 3 === 0 ? 2.4 : 0.8,
    });
  }

  // Окна: тёмные, с занавесками и горящие.
  const winW = 66;
  const winH = 28;
  let lit = 0;
  for (let r = 0; r < floors; r++) {
    for (let c = 0; c < cols; c++) {
      const x = c * colW + (colW - winW) / 2;
      const y = facadeTop + r * rowH + (rowH - winH) / 2 - 2;
      const p = random();
      let fill = '#34322e';
      if (p < 0.13) {
        fill = random() < 0.7 ? '#f28a2e' : '#ffbf5e';
        lit++;
      } else if (p < 0.24) {
        fill = '#5d5850';
      }
      svgEl(svg, 'rect', { x, y, width: winW, height: winH, fill });
      // Переплёт окна.
      svgEl(svg, 'line', { x1: x + winW * 0.38, y1: y, x2: x + winW * 0.38, y2: y + winH, stroke: '#1c1b19', 'stroke-width': 1.4, 'stroke-opacity': 0.55 });
      // Подоконный отлив.
      svgEl(svg, 'rect', { x: x - 4, y: y + winH, width: winW + 8, height: 3, fill: '#9d988d' });
    }
  }
  // Цоколь и тень от козырька.
  svgEl(svg, 'rect', { x: 0, y: facadeTop + facadeH, width: 1080, height: 6, fill: '#55514a' });
  document.getElementById('lit').textContent = lit;
</script>
</body>
</html>
