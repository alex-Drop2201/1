<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="size" content="1080x1920">
<title>Action Night — 2, условия</title>
<link rel="stylesheet" href="/brand/brand.css">
<link rel="stylesheet" href="story.css">
<style>
  /* Условия вечера в системе серии: заголовок с «линзой», пункты с крупными номерами, задание для друзей;
     толпа с Моной Лизой и лайками (из черновика) — внизу, ч/б, растворяется в чёрном. Дат, времени, места и бренда
     здесь нет — они на первой сторис. */
  .canvas { --gy: 30%; }
  .crowd { position: absolute; left: 0; top: 1180px; width: 1080px; height: 740px; z-index: 2;
           -webkit-mask: linear-gradient(180deg, transparent 0%, #000 34%); mask: linear-gradient(180deg, transparent 0%, #000 34%); }
  .item { position: absolute; left: 96px; right: 96px; display: grid; grid-template-columns: 140px 1fr; column-gap: 0; align-items: baseline; z-index: 5; }
  .num { font: 900 56px/0.9 'Unbounded'; color: var(--red); }
  .txt { font: 500 40px/1.25 'Inter'; letter-spacing: -0.01em; }
  .txt small { display: block; margin-top: 8px; font: 400 32px/1.3 'Inter'; color: var(--grey); }
  .rule { position: absolute; left: 96px; right: 96px; height: 2px; background: rgba(245, 243, 239, .22); z-index: 5; }
  .h2 { font: 800 30px/1 'Inter'; letter-spacing: .14em; text-transform: uppercase; }
  .quote { font: 400 40px/1.3 'Inter'; letter-spacing: -0.01em; }
  .quote em { font: italic 400 1.14em/1 'Playfair Display'; letter-spacing: 0; }
</style>
</head>
<body>
<main class="canvas">
  <div class="glow"></div>
  <img class="crowd" src="private/crowd.png" alt="">
  <img class="abs title" src="assets/t-nashe.png" alt="Наше" style="left: 290px; top: 270px; width: 500px;">
  <img class="abs title" src="assets/t-predl.png" alt="предложение" style="left: 90px; top: 412px; width: 900px;">
  <div class="abs c t" style="top: 556px;">тебе на&nbsp;<em>этот</em> вечер:</div>

  <div class="item" style="top: 680px;"><div class="num">01</div><div class="txt">Оденься как свой любимый актёр</div></div>
  <div class="item" style="top: 800px;"><div class="num">02</div><div class="txt">Возьми с&nbsp;собой друзей&nbsp;— <span class="red">получи&nbsp;приз</span></div></div>
  <div class="rule" style="top: 944px;"></div>
  <div class="abs c h2" style="top: 990px;">А&nbsp;теперь для тебя и&nbsp;твоих друзей</div>
  <div class="abs c quote" style="top: 1050px;">Придумайте своё оригинальное приветствие!<br>За&nbsp;самое <em>креативное</em> вы&nbsp;получите <span class="red">приз</span></div>
  <div class="grain"></div>
</main>
<script>window.renderReady = document.fonts.ready;</script>
</body>
</html>
