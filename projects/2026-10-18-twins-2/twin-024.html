<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="size" content="1080x1350">
<title>Близнец референса 024 — от смерти в жизнь</title>
<link rel="stylesheet" href="/brand/brand.css">
<link rel="stylesheet" href="/projects/2026-10-18-twins/twin.css">
<style>
  /* Референс 024: фото крещения на весь кадр — двое мужчин в тёмных мокрых футболках по пояс в купели, головы
     на 36–48 % высоты, верхняя треть — тёмный потолок зала с фермами. Поверх — надпись тонким белым маркером
     от руки (штрих ~0,7 % ширины), вся в верхних 40 %: «FROM» мелко x 14,5–38,5 % / y 5–12 %; «DEATH» x 8,5–56 % /
     y 15–27,5 %, первая буква крупнее, у последней правая ножка вытянута вверх до 8,5 %; «to» x 62,5–90 % / y 11,5–21 %
     с длинной восходящей чертой до x 90 %; стрелка от (14,6 %; 35,2 %) до (58 %; 30,9 %); «LIFE» x 62,5–90 % / y 24–38,5 %
     и черта от неё за правый край. Внизу на 97 % высоты мелкий белый гротеск: слева «spring baptisms», справа
     «may 25 / save the date» (~27 px, Medium).
     У нас: надпись — от руки в SVG (буквы нарисованы штрихами, как в референсе, а не шрифтом: у рукописных шрифтов
     с кириллицей штрих толще и нет вытянутых росчерков); «От смерти в жизнь» — Ин. 5:24. Подписи — Inter 700 (в референсе полужирный гротеск; 600 у нас нет)
     и отодвинуты от краёв до 36 px (обрезка 3:4 в сетке профиля). */
  body, .canvas { background: #2b2a2d; color: #F4F4F2; }
  .slot.photo { left: 0; top: 0; width: 1080px; height: 1350px; }
  /* Фото Pexels 10402204 (Su Casa Panamá): крещение в реке, двое в тёмных футболках, у правого радость до слёз.
     Верх фото на 38 % высоты и растворяется в тёмном «потолке» (так в референсе верхняя треть — тёмный зал);
     головы на 39–57 %. Люди крупнее, чем в референсе (кадр ближе) — другого кадра крещения на стоке нет.
     Обработка как в референсе: темнее, холоднее, приглушённый цвет (оранжевые надписи на футболке гаснут). */
  .slot.photo img { filter: saturate(.55) contrast(1.12) brightness(.82); }
  .tone { position: absolute; inset: 0; z-index: 2; pointer-events: none; mix-blend-mode: soft-light;
          background: linear-gradient(180deg, rgba(20,34,58,.0) 30%, rgba(20,34,58,.55) 100%); }
  /* Низ темнее, как тёмная вода купели в референсе: подписи не ложатся на светлые руки. */
  .low { position: absolute; left: 0; right: 0; bottom: 0; height: 330px; z-index: 3; pointer-events: none;
         background: linear-gradient(0deg, rgba(8,9,12,.86) 0%, rgba(8,9,12,.6) 30%, rgba(8,9,12,0) 100%); }
  svg.art { z-index: 5; }
  .foot { top: 1288px; z-index: 6; font: 700 27px/1.2 'Inter'; letter-spacing: -0.015em; white-space: nowrap; color: #F4F4F2; }
  .foot.l { left: 36px; }
  .foot.r { right: 36px; }
</style>
</head>
<body>
<main class="canvas">
  <div class="slot photo" data-src="assets/024.jpg" data-ph="assets/ph-024-1.png"
       data-need="крещение: двое мужчин в тёмных футболках по пояс в воде, радость; головы на 36–48 % высоты"></div>
  <div class="tone"></div>
  <div class="low"></div>
  <svg class="art" id="art" viewBox="0 0 1080 1350" width="1080" height="1350" role="img" aria-label="От смерти в жизнь"></svg>
  <div class="abs foot l">осеннее крещение</div>
  <div class="abs foot r">25 октября / сохрани дату</div>
</main>
<script src="/projects/2026-10-18-twins/twin.js"></script>
<script>
  initSlots();
  const art = document.getElementById('art');
  const random = rng(24);
  const jit = (a) => (random() - 0.5) * 2 * a;

  // Буквы штрихами в квадрате высоты прописной: x — в долях высоты, y 0 — верх, 1 — базовая линия.
  // c: true — плавная кривая, иначе ломаная (углы остаются острыми, как у быстрого маркера).
  const G = {
    'О': { w: 0.78, s: [{ c: true, p: [[0.5, 0.02], [0.16, 0.12], [0.01, 0.5], [0.16, 0.92], [0.46, 1.0], [0.72, 0.84], [0.78, 0.42], [0.6, 0.06], [0.34, 0.03]] }] },
    'Т': { w: 0.8, s: [{ p: [[-0.04, 0.05], [0.84, -0.03]] }, { p: [[0.41, 0.0], [0.38, 1.0]] }] },
    'С': { w: 0.8, s: [{ c: true, p: [[0.78, 0.16], [0.56, 0.0], [0.22, 0.07], [0.02, 0.46], [0.14, 0.88], [0.46, 1.0], [0.8, 0.86]] }] },
    'М': { w: 0.98, s: [{ p: [[0.0, 1.0], [0.09, 0.0], [0.47, 0.74], [0.86, 0.0], [0.97, 1.0]] }] },
    'Е': { w: 0.78, s: [{ p: [[0.74, 0.0], [0.05, 0.0], [0.0, 1.0], [0.8, 0.97]] }, { p: [[0.02, 0.5], [0.6, 0.47]] }] },
    'Р': { w: 0.74, s: [{ p: [[0.03, 1.04], [0.06, 0.0]] }, { c: true, p: [[0.06, 0.0], [0.5, 0.0], [0.72, 0.2], [0.55, 0.46], [0.06, 0.5]] }] },
    'И': { w: 0.76, s: [{ p: [[0.0, 0.0], [0.02, 1.0], [0.72, 0.0], [0.74, 1.0]] }] },
    'Ж': { w: 1.02, s: [{ p: [[0.0, 0.0], [0.44, 0.5], [0.02, 1.0]] }, { p: [[0.5, -0.03], [0.5, 1.0]] }, { p: [[0.98, 0.0], [0.56, 0.5], [1.0, 1.0]] }, { p: [[0.44, 0.5], [0.56, 0.5]] }] },
    'З': { w: 0.76, s: [{ c: true, p: [[0.04, 0.14], [0.34, 0.0], [0.65, 0.12], [0.6, 0.38], [0.28, 0.48], [0.63, 0.56], [0.75, 0.8], [0.46, 1.0], [0.03, 0.88]] }] },
    'Н': { w: 0.74, s: [{ p: [[0.02, 0.0], [0.0, 1.0]] }, { p: [[0.73, 0.0], [0.71, 1.0]] }, { p: [[0.0, 0.52], [0.72, 0.49]] }] },
    'Ь': { w: 0.7, s: [{ p: [[0.06, 0.0], [0.04, 1.0]] }, { c: true, p: [[0.05, 0.47], [0.5, 0.45], [0.7, 0.7], [0.52, 0.98], [0.04, 1.0]] }] },
    'в': { w: 0.7, s: [{ p: [[0.04, 0.0], [0.02, 1.0]] }, { c: true, p: [[0.04, 0.0], [0.44, 0.0], [0.6, 0.22], [0.44, 0.45], [0.03, 0.48]] },
                       { c: true, p: [[0.03, 0.48], [0.54, 0.5], [0.7, 0.76], [0.52, 0.98], [0.02, 1.0]] }] },
  };

  const SLANT = Math.tan(8 * Math.PI / 180); // наклон вперёд, как у быстрого почерка
  const linePath = (pts) => 'M' + pts.map((p) => `${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' L');
  const stroke = (d, width = 8) => svgEl(art, 'path', { d, fill: 'none', stroke: '#F4F4F2', 'stroke-width': width,
    'stroke-linecap': 'round', 'stroke-linejoin': 'round' });

  // Слово: буквы по очереди от x, базовая линия base (может «гулять» — массив по буквам), высота h (тоже по буквам).
  // narrow — сжатие букв по ширине, gap — пробел между буквами в долях h; extra — правки отдельных штрихов.
  function word(text, x, base, h, { narrow = 0.82, gap = 0.07, extra = {} } = {}) {
    let cx = x;
    [...text].forEach((ch, i) => {
      const g = G[ch];
      const hh = Array.isArray(h) ? h[i] : h;
      const by = (Array.isArray(base) ? base[i] : base) + jit(hh * 0.03);
      const k = 1 + jit(0.06);
      const rot = jit(5) * Math.PI / 180;
      const ox = cx, w = g.w * narrow * hh * k;
      const strokes = (extra[i] ? extra[i](g.s) : g.s);
      for (const st of strokes) {
        // Быстрый маркер: концы прямых штрихов чуть перелетают.
        let src = st.p;
        if (!st.c) {
          const over = (a, b) => [b[0] + (b[0] - a[0]) * (0.02 + random() * 0.07), b[1] + (b[1] - a[1]) * (0.02 + random() * 0.07)];
          src = [over(src[1], src[0]), ...src.slice(1, -1), over(src[src.length - 2], src[src.length - 1])];
        }
        const pts = src.map(([u, v]) => {
          let px = u * narrow * hh * k, py = (v - 1) * hh * k;   // от левого нижнего угла буквы
          px -= py * SLANT;                                      // наклон
          const rx = px * Math.cos(rot) - py * Math.sin(rot), ry = px * Math.sin(rot) + py * Math.cos(rot);
          return [ox + rx + jit(hh * 0.012), by + ry + jit(hh * 0.012)];
        });
        stroke(st.c ? smoothOpen(pts) : linePath(pts));
      }
      cx += w + gap * hh;
    });
    return cx;
  }

  // «От» — мелко, на месте «FROM».
  word('ОТ', 160, 140, [60, 74], { narrow: 0.85 });
  // «СМЕРТИ» — первая буква крупнее, базовая линия поднимается к середине и снова опускается, как у «DEATH»;
  // у «И» правая ножка вытянута вверх, как у «H» в референсе.
  word('СМЕРТИ', 92, [372, 336, 318, 316, 330, 352], [152, 112, 96, 92, 112, 122], {
    narrow: 0.88, gap: 0.05,
    extra: { 5: (s) => [{ p: [[0.0, 0.0], [0.02, 1.0], [0.72, 0.0]] }, { p: [[0.73, -0.8], [0.74, 1.0]] }] },
  });
  // «в» и длинная восходящая черта из-под неё — на месте «to».
  word('в', 708, 276, 88, { narrow: 0.85 });
  stroke(smoothOpen([[686, 304], [790, 288], [884, 266], [972, 240]]));
  // Стрелка к «ЖИЗНЬ».
  stroke(smoothOpen([[158, 476], [300, 466], [450, 447], [606, 420]]));
  stroke(linePath([[516, 381], [608, 419], [530, 465]]));
  // «ЖИЗНЬ» — первая буква крупнее и ниже, как «L» в референсе; черта над словом уходит за правый край.
  word('ЖИЗНЬ', 652, [520, 494, 488, 486, 482], [150, 112, 104, 108, 104], { narrow: 0.72, gap: 0.06 });
  stroke(smoothOpen([[836, 352], [930, 340], [1030, 326], [1100, 318]]));
</script>
</body>
</html>
