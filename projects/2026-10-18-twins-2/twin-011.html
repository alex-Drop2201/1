<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="size" content="1080x1350">
<title>Близнец референса 011 — вера, которая двигает горы</title>
<link rel="stylesheet" href="/brand/brand.css">
<link rel="stylesheet" href="/projects/2026-10-18-twins/twin.css">
<style>
  /* Референс 011 (1024×1280 → 1080×1350, ×1.055): бумага #F5F5F5 с зерном.
     Фото гор с жёсткими краями: x 1,8–98,6 %, y 1,4–52,3 % (19–1065 × 19–706 px).
     «FAITH» — тяжёлый гротеск во всю ширину x 1,5–98,8 %, прописные y 53,9–79,9 % (727–1079 px), краска
     зелёно-серая #636C5B с диагональной полутоновой сеткой и светлыми пятнами.
     Подписи под словом (тот же гротеск, прописные 2,3 %): левая от x 1,9 %, средняя по центру x 46 %, правая до x 98,5 %;
     верх прописных 81,3 %. Цитата — геометрический гротеск прописными, 3 строки по центру, верх 86,1 %, шаг 2,2 % (у нас 2,6 %: у кириллицы
     хвосты Д, Ц и крышка Й задевали соседнюю строку).
     Ссылка — узкая контрастная антиква, прописные 94,3–98,4 %, по центру; по бокам по 8 колец (x 1,9–28,3 % и 71,8–98,1 %).
     Шрифты: тяжёлый гротеск → Sofia Sans Condensed 900 (слово и подписи), цитата → Montserrat 600,
     ссылка → Oranienbaum. Фото — Pexels 18430363, отражено (тёмный склон слева, как в референсе), без скал.
     Отступления: «ВЕРА» — 4 буквы против 5, буквы шире; кегль под 340 px и растяжение ×1.035 до 352 px;
     цитата 32 px (в референсе ~30) — правило проекта «не мельче 32». */
  body, .canvas { background: #FCFCFA; color: #575954; }
  .grain::after { opacity: .12; }
  .photo { left: 19px; top: 19px; width: 1046px; height: 687px; }
  /* Плёнка: приглушённый цвет, приподнятые тени, дымка — как в референсе. */
  .photo img { filter: saturate(.6) contrast(.82) brightness(1.17); }
  /* Земля в референсе оливковая, а небо голубое: оливковый тон только ниже линии неба. */
  .photo-tint { position: absolute; left: 19px; top: 19px; width: 1046px; height: 687px; z-index: 1; pointer-events: none;
                background: #7d8862; mix-blend-mode: color; opacity: .5;
                -webkit-mask-image: linear-gradient(180deg, transparent 26%, #000 46%); mask-image: linear-gradient(180deg, transparent 26%, #000 46%); }
  .ink { position: absolute; white-space: nowrap; line-height: 1; color: transparent;
         background: url(assets/011-ink.png) 0 0 / 1080px 420px; -webkit-background-clip: text; background-clip: text; }
  .word { font: 900 400px/1 'Sofia Sans Condensed'; text-transform: uppercase; background-position: -16px -10px; }
  .lab { font: 900 40px/1 'Sofia Sans Condensed'; text-transform: uppercase; background-position: 0 -300px; }
  .quote { left: 16px; width: 1050px; font: 600 32px/35px 'Montserrat'; text-transform: uppercase;
           text-align: center; color: #575954; }
  .ref { font: 400 80px/1 'Oranienbaum'; color: #575954; white-space: nowrap; }
  svg.rings { position: absolute; left: 0; top: 0; width: 1080px; height: 1350px; overflow: visible; }
</style>
</head>
<body>
<main class="canvas grain">
  <div class="slot photo" data-src="assets/011.jpg" data-need="горы с высоты: долина, хребты в дымке, светлое небо с облаками"></div>
  <div class="photo-tint"></div>
  <!-- data-bleed: за край выходит только пустой правый отступ буквы «А», краска кончается на 1067 px, как в референсе -->
  <div class="ink word" id="w" data-bleed>Вера</div>
  <div class="ink lab" id="a">которая</div>
  <div class="ink lab" id="b">двигает</div>
  <div class="ink lab" id="c">горы</div>
  <div class="abs quote" id="q">«…если вы будете иметь веру с&nbsp;горчичное зерно и&nbsp;скажете горе сей: „перейди отсюда туда“, и&nbsp;она перейдёт; и&nbsp;ничего не&nbsp;будет невозможного для&nbsp;вас»</div>
  <div class="abs ref" id="r">МАТФЕЯ 17:20</div>
  <svg class="rings" id="rings"></svg>
</main>
<script src="/projects/2026-10-18-twins/twin.js"></script>
<script>
  initSlots();
  const ctx = document.createElement('canvas').getContext('2d');
  // Поставить строку по краям краски: прописные высотой capH с верхом в capTop; по ширине — от x0 до x1
  // (разрядкой) или по одной точке: align 'left' | 'center' | 'right' от x0.
  function placeInk(el, { capTop, capH, x0, x1, align = 'left', stretch = 1 }) {
    const cs = getComputedStyle(el);
    const font = (size) => `${cs.fontWeight} ${size}px ${cs.fontFamily}`;
    const text = cs.textTransform === 'uppercase' ? el.textContent.toUpperCase() : el.textContent;
    ctx.font = font(100);
    const capRatio = ctx.measureText('Н').actualBoundingBoxAscent / 100;
    const size = capH / stretch / capRatio;
    ctx.font = font(size);
    const m = ctx.measureText(text);
    const ink = m.actualBoundingBoxLeft + m.actualBoundingBoxRight;
    let ls = 0;
    if (x1 != null) ls = (x1 - x0 - ink) / (text.length - 1);
    const width = ink + ls * (text.length - 1);
    const start = x1 != null || align === 'left' ? x0 : align === 'center' ? x0 - width / 2 : x0 - width;
    el.style.fontSize = `${size}px`;
    el.style.letterSpacing = `${ls}px`;
    // Разрядка после последней буквы не нужна: иначе блок шире краски и вылезает за край.
    if (ls) el.innerHTML = `${el.textContent.slice(0, -1)}<span style="letter-spacing: 0">${el.textContent.slice(-1)}</span>`;
    el.style.left = `${start + m.actualBoundingBoxLeft}px`;
    const base = (size - (m.fontBoundingBoxAscent + m.fontBoundingBoxDescent)) / 2 + m.fontBoundingBoxAscent;
    el.style.transformOrigin = 'left top';
    el.style.transform = stretch !== 1 ? `scaleY(${stretch})` : '';
    el.style.top = `${capTop - stretch * (base - capH / stretch)}px`;
  }
  // Блок текста: верх прописных первой строки — в capTop (по метрикам шрифта и межстрочному интервалу).
  function placeBlock(el, capTop) {
    const cs = getComputedStyle(el);
    const size = parseFloat(cs.fontSize), lh = parseFloat(cs.lineHeight);
    ctx.font = `${cs.fontWeight} ${size}px ${cs.fontFamily}`;
    const m = ctx.measureText('Н');
    const base = (lh - (m.fontBoundingBoxAscent + m.fontBoundingBoxDescent)) / 2 + m.fontBoundingBoxAscent;
    el.style.top = `${capTop - (base - m.actualBoundingBoxAscent)}px`;
  }
  function rings(svg, x0, x1, top, d, n) {
    const step = (x1 - x0 - d) / (n - 1);
    for (let i = 0; i < n; i++) {
      svgEl(svg, 'circle', { cx: x0 + d / 2 + i * step, cy: top + d / 2, r: d / 2 - 1.3,
        fill: 'none', stroke: '#575954', 'stroke-width': 2.6 });
    }
  }
  afterFonts(["900 100px 'Sofia Sans Condensed'", "600 32px 'Montserrat'", "400 80px 'Oranienbaum'"], () => {
    // Кириллица шире: при высоте 352 буквы слиплись бы, поэтому кегль под 340 и растяжение ×1.035 (зазоры ~18 px, как в референсе).
    placeInk(document.getElementById('w'), { capTop: 727, capH: 352, x0: 16, x1: 1067, stretch: 1.035 });
    placeBlock(document.getElementById('q'), 1162);
    placeInk(document.getElementById('a'), { capTop: 1097, capH: 31, x0: 20 });
    placeInk(document.getElementById('b'), { capTop: 1097, capH: 31, x0: 497, align: 'center' });
    placeInk(document.getElementById('c'), { capTop: 1097, capH: 31, x0: 1064, align: 'right' });
    placeInk(document.getElementById('r'), { capTop: 1273, capH: 55, x0: 540, align: 'center' });
    const svg = document.getElementById('rings');
    rings(svg, 21, 306, 1273, 55, 8);
    rings(svg, 775, 1060, 1273, 55, 8);
  });
</script>
</body>
</html>
