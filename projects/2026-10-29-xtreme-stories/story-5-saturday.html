<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="size" content="1080x1920">
<title>Сторис 5 — перенос на субботу</title>
<link rel="stylesheet" href="/brand/brand.css">
<link rel="stylesheet" href="pixel.css">
<style>
  /* Новая сторис серии XTREME: «завтра молодёжки не будет — переносим всё на субботу».
     Фон — присланный заказчиком (720×1280 → 1080×1920). Устройство — один в один с 3-й сторис (YOUTH CODE,
     размеры сняты с export/story-3.png): белая карточка 99–979 × 380–1445 px со скруглением, за ней персиковая,
     тот же зажим на том же месте (вырезан из 3-й); заголовок пиксельным шрифтом на месте «YOUTH CODE»
     (прописные 53 px, верх 524); правила — пиксельным шрифтом с квадратным пунктом на оси 151 px, текст от 173 px
     (прописные 25 и 23 px, шаг строк 47); список — жирный узкий курсив с круглыми пунктами на строках
     «героя / персонажа / актёра» (прописные 30 px, верх 786 / 845 / 903); фиолетовая подпись Comfortaa по центру.
     Фиолетовый — #5D1AE4, как в 3-й. Пиксельный шрифт (Tiny5) растянут ровно до ширины букв автора, список — Fira Sans
     Black Italic (по пропорциям ближе к «ГЕРОЯ / ПЕРСОНАЖА», чем узкий Fira Extra Condensed), подпись — Comfortaa
     с тонкой обводкой в цвет, чтобы штрих был как у автора. */
  body, .canvas { color: #111; }
  .back { left: 140px; top: 408px; width: 872px; height: 1050px; border-radius: 40px; transform: rotate(2.6deg);
          background: linear-gradient(170deg, #f8ca93, #f3a484); box-shadow: 0 16px 34px rgba(150, 60, 0, .2); }
  .card { left: 99px; top: 380px; width: 880px; height: 1065px; border-radius: 38px; background: #fff;
          box-shadow: 0 22px 44px rgba(150, 60, 0, .22); }
  .clip { left: 440px; top: 198px; width: 220px; z-index: 5; }
  .t { position: absolute; z-index: 6; white-space: nowrap; }
  .sq { position: absolute; z-index: 6; width: 15px; height: 15px; background: #111; }
  .dot { position: absolute; z-index: 6; width: 13px; height: 13px; border-radius: 50%; background: #111; }
  .note { position: absolute; z-index: 6; left: 99px; width: 880px; text-align: center; color: #5d1ae4;
          font: 700 50px/1.2 'Comfortaa'; letter-spacing: -0.01em; -webkit-text-stroke: 2px #5d1ae4; }
  .v { color: #5d1ae4; }
</style>
</head>
<body>
<main class="canvas">
  <img class="base" src="assets/bg-saturday.jpg" alt="">
  <div class="abs back"></div>
  <div class="abs card"></div>
  <img class="abs clip" src="assets/clip.png" alt="">
  <div id="text"></div>
  <div class="note" id="note" style="top: 1252px;">(ждём тебя<br>в&nbsp;субботу!)</div>
</main>
<script>
  const X = 173, AXIS = 151, RIGHT = 939;            // левый край текста, ось пунктов, правый край поля
  let SX = 1.45;                                     // растяжение пиксельного шрифта — подгоняется под ширину букв автора
  const box = document.getElementById('text');
  const ctx = document.createElement('canvas').getContext('2d');

  // Строка с верхом прописных в capTop и высотой прописных capH; sx — растяжение по ширине (пиксельный шрифт 1,45).
  function line(text, { family, weight = 400, style = 'normal', capTop, capH, x = X, sx = 1, center = false, html = null }) {
    ctx.font = `${style} ${weight} 100px ${family}`;
    const ratio = ctx.measureText('Н').actualBoundingBoxAscent / 100;
    const size = capH / ratio;
    ctx.font = `${style} ${weight} ${size}px ${family}`;
    const m = ctx.measureText('Н');
    const el = document.createElement('div');
    el.className = 't';
    el.style.font = `${style} ${weight} ${size}px/1 ${family}`;
    if (html) el.innerHTML = html; else el.textContent = text;
    if (sx !== 1) { el.style.transform = `scaleX(${sx})`; el.style.transformOrigin = 'left top'; }
    el.style.textTransform = 'uppercase';
    box.appendChild(el);
    // верх прописных: строка высотой в кегль, базовая линия — по метрикам шрифта
    const base = (size - (m.fontBoundingBoxAscent + m.fontBoundingBoxDescent)) / 2 + m.fontBoundingBoxAscent;
    el.style.top = `${capTop - (base - m.actualBoundingBoxAscent)}px`;
    const w = el.getBoundingClientRect().width;
    el.style.left = `${center ? 539 - w / 2 : x}px`;
    return { el, w, size };
  }

  // Абзац пиксельным шрифтом с переносом по словам в поле X…RIGHT; части с классом v — фиолетовые.
  function para(parts, capTop, capH, pitch) {
    const words = parts.flatMap(([txt, cls]) => txt.split(' ').map((w) => [w, cls]));
    let row = [], y = capTop;
    const html = (r) => r.map(([w, cls]) => (cls ? `<span class="${cls}">${w}</span>` : w)).join(' ');
    const flush = () => {
      line('', { family: "'Tiny5'", capTop: y, capH, sx: SX, html: html(row) });
      row = []; y += pitch;
    };
    for (const wd of words) {
      const probe = line('', { family: "'Tiny5'", capTop: -500, capH, sx: SX, html: html([...row, wd]) });
      probe.el.remove();
      if (X + probe.w > RIGHT && row.length) flush();
      row.push(wd);
    }
    if (row.length) flush();
    return y - pitch;
  }

  const square = (capTop, capH) => {
    const s = document.createElement('div');
    s.className = 'sq';
    s.style.left = `${AXIS - 7.5}px`;
    s.style.top = `${capTop + capH / 2 - 7.5}px`;
    box.appendChild(s);
  };

  window.renderReady = Promise.all([document.fonts.load("40px 'Tiny5'"), document.fonts.load("italic 900 40px 'Fira Sans'"),
    document.fonts.load("700 40px 'Comfortaa'")]).then(() => {
    // Ширина пиксельного шрифта как у автора: «ТЫ ДОЛЖЕН ПРИЙТИ» в 3-й сторис — 443 px при прописных 25 px.
    const probe = line('Ты должен прийти', { family: "'Tiny5'", capTop: -500, capH: 25 });
    SX = 443 / probe.w;
    probe.el.remove();
    // Заголовок — на месте и в размер «YOUTH CODE».
    line('Перенос', { family: "'Tiny5'", capTop: 524, capH: 53, sx: SX, center: true });
    // Правило 1 — как «ты должен прийти / в костюме своего любимого:».
    square(680, 25);
    para([['Завтра молодёжки не будет —', ''], ['переносим всё на:', '']], 680, 25, 47);
    // Список — как «героя / персонажа / актёра».
    [['субботу, 31.10', 786], ['18:00', 845], ['Универмаг, 3-й этаж', 903]].forEach(([txt, capTop]) => {
      line(txt, { family: "'Fira Sans'", weight: 900, style: 'italic', capTop, capH: 30 });
      const d = document.createElement('div');
      d.className = 'dot';
      d.style.left = `${AXIS - 6.5}px`;
      d.style.top = `${capTop + 15 - 6.5}px`;
      box.appendChild(d);
    });
    // Правило 2 — как «если придёшь со своими друзьями… ты получишь…», вторая половина фиолетовая.
    square(983, 23);
    const last = para([['Если собирался прийти завтра —', ''], ['приходи в субботу и зови друзей!', 'v']], 983, 23, 47);
    // Подпись — на том же расстоянии от второго правила, что в 3-й сторис (~110 px), карточка — по содержимому.
    const note = document.getElementById('note');
    note.style.top = `${last + 23 + 100}px`;
    const bottom = note.offsetTop + note.offsetHeight + 64;
    document.querySelector('.card').style.height = `${bottom - 380}px`;
    document.querySelector('.back').style.height = `${bottom - 380 - 15}px`;
  });
</script>
</body>
</html>
