<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="size" content="1080x1920">
<title>По референсу 010</title>
<link rel="stylesheet" href="/brand/brand.css">
<style>
  /* Референс 010 (сторис): белый фон; у левого края (≈3 %) столбик жирного геометрического гротеска,
     по одному-два слова в строке, плотный интерлиньяж; блок занимает y 33–72 %. */
  body, .canvas { background: #ffffff; }
  .t {
    position: absolute; left: 32px; top: 640px;
    font: 800 96px/0.94 'Montserrat'; letter-spacing: -0.045em; color: #0b0b0b;
  }
</style>
</head>
<body>
<main class="canvas">
  <div class="t">Господи,<br>научи<br>меня<br>любить<br>других<br>так,<br>как любишь<br>Ты.</div>
</main>
</body>
</html>
