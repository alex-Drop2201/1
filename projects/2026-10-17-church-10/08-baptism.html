<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="size" content="1080x1350">
<title>08 — Крещение</title>
<link rel="stylesheet" href="/brand/brand.css">
<link rel="stylesheet" href="kit.css">
<style>
  /* Приём A — крупный гротеск и служебная строка; вместо фото — заголовок, уходящий под воду. Референсы: 001 («для крещения»), 024. */
  :root { --deep: #04222a; --white: #F4F7F5; --soft: #9fc1c3; }
  body { background: var(--deep); }
  .canvas { color: var(--white); }
  .meta { left: 80px; right: 80px; top: 120px; display: flex; align-items: center; gap: 22px; font-size: 21px; color: var(--white); }
  .meta i { flex: 1; height: 1.5px; background: rgba(244,247,245,.7); }
  .verse { left: 80px; right: 80px; bottom: 150px; font: 500 34px/1.3 'Inter'; letter-spacing: -0.01em; }
  .verse small { display: block; margin-top: 10px; font: 400 20px/1 'IBM Plex Mono'; letter-spacing: .14em; color: var(--soft); }
  .foot { left: 80px; right: 80px; bottom: 68px; display: flex; justify-content: space-between; font-size: 21px; color: var(--soft); }
</style>
</head>
<body>
<main class="canvas grain-light">
  <svg class="art" id="art" width="1080" height="1350" viewBox="0 0 1080 1350"></svg>
  <div class="abs meta mono"><span>8 ноября · 12:00</span><i></i><span>Запись в профиле</span></div>
  <div class="abs verse">«Кто будет веровать и креститься,<br>спасён будет».<small>Марк 16:16</small></div>
  <div class="abs foot mono"><span>Крещение</span><span>Воскресное служение</span></div>
</main>
<script src="kit.js"></script>
<script>
  const svg = document.getElementById('art');
  const defs = svgEl(svg, 'defs');
  const surface = 560;

  // Вода: глубокий градиент, светлые блики и мягкие разводы.
  const deep = svgEl(defs, 'linearGradient', { id: 'deep', x1: '0', y1: '0', x2: '0', y2: '1' });
  svgEl(deep, 'stop', { offset: '0', 'stop-color': '#0f5560' });
  svgEl(deep, 'stop', { offset: '0.35', 'stop-color': '#0a3f49' });
  svgEl(deep, 'stop', { offset: '1', 'stop-color': '#03181e' });
  svgEl(svg, 'rect', { width: 1080, height: 1350, fill: 'url(#deep)' });

  const caustic = svgEl(defs, 'filter', { id: 'caustic', x: 0, y: 0, width: '100%', height: '100%' });
  svgEl(caustic, 'feTurbulence', { type: 'turbulence', baseFrequency: '0.006 0.018', numOctaves: 3, seed: 4, result: 't' });
  const ct = svgEl(caustic, 'feComponentTransfer', { in: 't', result: 'lines' });
  svgEl(ct, 'feFuncA', { type: 'table', tableValues: '0.9 0.25 0 0 0 0 0' });
  svgEl(caustic, 'feColorMatrix', { in: 'lines', type: 'matrix', values: '0 0 0 0 0.78  0 0 0 0 0.95  0 0 0 0 0.95  0 0 0 1 0' });
  const fade = svgEl(defs, 'linearGradient', { id: 'fade', x1: '0', y1: '0', x2: '0', y2: '1' });
  svgEl(fade, 'stop', { offset: '0', 'stop-color': 'white', 'stop-opacity': 1 });
  svgEl(fade, 'stop', { offset: '0.75', 'stop-color': 'white', 'stop-opacity': 0.15 });
  svgEl(fade, 'stop', { offset: '1', 'stop-color': 'white', 'stop-opacity': 0 });
  const fm = svgEl(defs, 'mask', { id: 'fadeMask' });
  svgEl(fm, 'rect', { width: 1080, height: 1350, fill: 'url(#fade)' });
  svgEl(svg, 'rect', { width: 1080, height: 1350, filter: 'url(#caustic)', mask: 'url(#fadeMask)', opacity: 0.32 });

  // Заголовок: верх над водой чёткий, низ под водой преломлён волной.
  const wave = svgEl(defs, 'filter', { id: 'wave', x: '-5%', y: '-20%', width: '110%', height: '140%' });
  svgEl(wave, 'feTurbulence', { type: 'fractalNoise', baseFrequency: '0.012 0.07', numOctaves: 2, seed: 9, result: 'w' });
  svgEl(wave, 'feDisplacementMap', { in: 'SourceGraphic', in2: 'w', scale: 16, xChannelSelector: 'R', yChannelSelector: 'G' });
  const above = svgEl(defs, 'clipPath', { id: 'above' });
  svgEl(above, 'rect', { x: 0, y: 0, width: 1080, height: surface });
  const below = svgEl(defs, 'clipPath', { id: 'below' });
  svgEl(below, 'rect', { x: 0, y: surface, width: 1080, height: 1350 - surface });

  const titleStyle = "font: 900 200px 'Inter'; letter-spacing: -0.045em";
  const word = 'КРЕЩЕНИЕ';
  const crisp = svgEl(svg, 'text', { x: 540, y: surface + 66, 'text-anchor': 'middle', fill: '#F4F7F5', style: titleStyle, 'clip-path': 'url(#above)' }, word);
  const gWet = svgEl(svg, 'g', { 'clip-path': 'url(#below)' });
  const wet = svgEl(gWet, 'text', { x: 540, y: surface + 66, 'text-anchor': 'middle', fill: '#cfe6e6', 'fill-opacity': 0.75, style: titleStyle, filter: 'url(#wave)' }, word);

  // Линия поверхности воды.
  const pts = [];
  for (let x = 0; x <= 1080; x += 30) pts.push([x, surface + Math.sin(x / 70) * 3]);
  svgEl(svg, 'path', { d: smoothOpen(pts), fill: 'none', stroke: '#F4F7F5', 'stroke-opacity': 0.55, 'stroke-width': 1.6 });

  afterFonts(["900 200px 'Inter'"], () => {
    // Подгоняем заголовок под ширину 920 и сажаем так, чтобы вода закрывала нижнюю треть букв.
    const w = crisp.getBBox().width;
    const size = (200 * 920) / w;
    for (const t of [crisp, wet]) t.setAttribute('style', `font: 900 ${size.toFixed(1)}px 'Inter'; letter-spacing: -0.045em`);
    const cap = size * 0.727;
    for (const t of [crisp, wet]) t.setAttribute('y', (surface + cap * 0.36).toFixed(1));
  });
</script>
</body>
</html>
